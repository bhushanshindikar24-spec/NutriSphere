services:
  mysqldb:
    image: mysql:8.0
    container_name: nutrisphere-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-nutrisphere}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - nutrisphere-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: deployment/Dockerfile.backend
    container_name: nutrisphere-backend
    restart: unless-stopped
    depends_on:
      mysqldb:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      DB_URL: jdbc:mysql://mysqldb:3306/${MYSQL_DATABASE:-nutrisphere}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      FILE_UPLOAD_DIR: /var/nutrisphere/uploads
    ports:
      - "8080:8080"
    volumes:
      - uploads_data:/var/nutrisphere/uploads
    networks:
      - nutrisphere-net

  frontend:
    build:
      context: .
      dockerfile: deployment/Dockerfile.frontend
    container_name: nutrisphere-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - nutrisphere-net

volumes:
  mysql_data:
  uploads_data:

networks:
  nutrisphere-net:
    driver: bridge
