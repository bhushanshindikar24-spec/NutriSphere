spring.config.import=optional:file:.env[.properties]
spring.application.name=NutriSphere
server.port=8080

# Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/nutrisphere?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Flyway
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.open-in-view=false

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION:86400000}
app.jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# Email / SMTP
# Configure MAIL_HOST, MAIL_USERNAME, MAIL_PASSWORD and MAIL_FROM in the runtime environment.
# Local development can use MailHog or another SMTP test server.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:noreply@localhost}
app.mail.verification-url=${FRONTEND_URL:http://localhost:5173}/verify-email
app.mail.password-reset-url=${FRONTEND_URL:http://localhost:5173}/reset-password

# File Storage
app.file.upload-dir=${FILE_UPLOAD_DIR:./uploads}
app.file.max-size=${FILE_MAX_SIZE:10485760}
app.file.allowed-types=image/jpeg,image/png,image/gif,application/pdf,image/webp

# USDA FoodData Central
app.usda.api-key=${USDA_API_KEY:}
app.usda.base-url=https://api.nal.usda.gov/fdc/v1

# Open Food Facts
app.openfoodfacts.base-url=https://world.openfoodfacts.org/api/v2

# AI Service — configurable provider abstraction
# Use NUTRISPHERE_AI_PROVIDER=openai|groq|mock etc.
# Use NUTRISPHERE_AI_MODEL for the model (e.g. gemini-2.0-flash-lite, gpt-4o-mini, llama-3.1-8b-instant)
nutrisphere.ai.provider=${NUTRISPHERE_AI_PROVIDER:openai}
nutrisphere.ai.api-key=${NUTRISPHERE_AI_API_KEY:}
nutrisphere.ai.base-url=${NUTRISPHERE_AI_BASE_URL:https://api.openai.com/v1}
nutrisphere.ai.model=${NUTRISPHERE_AI_MODEL:gpt-4o-mini}
nutrisphere.ai.temperature=0.3
nutrisphere.ai.max-tokens=2000

# Logging
logging.level.com.nutrisphere=INFO
logging.level.org.springframework.security=WARN

# Multipart
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Profiles
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
