name: NutriSphere CI

on:
  push:
    branches:
      - master
      - phase2/auth-email-verification
      - phase3/final-completion
  pull_request:
    branches:
      - master

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: NutriSphere/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Test backend
        run: ./mvnw clean test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: NutriSphere/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: NutriSphere/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        working-directory: NutriSphere
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          JWT_SECRET: ci-jwt-secret-32-bytes-minimum
        run: docker compose config
      - name: Build Docker images
        working-directory: NutriSphere
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          JWT_SECRET: ci-jwt-secret-32-bytes-minimum
        run: docker compose build
